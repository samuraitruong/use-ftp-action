name: 'use-ftp-action'
description: 'An ftp client ac tion to sync data between ci & remote ftp server'
inputs:
  FTP_USER:
    description: 'username to access ftp server'
    required: true
  FTP_PASSWORD:
    description: 'password to access ftp server'
    required: true
  
  FTP_HOST:
    description: 'ftp server name or IP'
    required: true

  FTP_ROOT_FOLDER:
    description: 'the root folder on ftp'
    required: false
    default: '.'
  LOCAL_FOLDER:
    description: 'Local folder name'
    required: false
    default: '.'
  SYNC_MODE:
    description: 'Sync mode: download or upload'
    required: false
    default: 'download'
  PARALLEL_CONNECTIONS:
    description: 'Number of parallel connections (1-10, use 1 for slow servers)'
    required: false
    default: '1'
  CONNECTION_TIMEOUT:
    description: 'Connection timeout in seconds'
    required: false
    default: '60'
  RETRY_COUNT:
    description: 'Number of connection retries'
    required: false
    default: '3'
  TRANSFER_RATE_LIMIT:
    description: 'Transfer rate limit in KB/s (0 for unlimited)'
    required: false
    default: '0'
  DEBUG_MODE:
    description: 'Enable debug logging (true/false)'
    required: false
    default: 'false'
runs:
  using: 'docker'
  image: 'Dockerfile'